version: '3.8'

services:
  # ===================
  # Database Services
  # ===================
  mysql:
    image: mysql:8.0
    container_name: fintrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:10.11
    container_name: fintrack-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${MARIADB_DATABASE}
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: fintrack-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Backend Services
  # ===================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: fintrack-auth
    restart: unless-stopped
    command: sh -c "npx sequelize-cli db:migrate && node src/app.js"
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    environment:
      PORT: ${AUTH_SERVICE_PORT}
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_URL: redis://fintrack-redis:${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${AUTH_SERVICE_PORT}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    container_name: fintrack-transaction
    restart: unless-stopped
    command: sh -c "npx sequelize-cli db:migrate && node src/app.js"
    ports:
      - "${TRANSACTION_SERVICE_PORT}:${TRANSACTION_SERVICE_PORT}"
    environment:
      PORT: ${TRANSACTION_SERVICE_PORT}
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${TRANSACTION_SERVICE_PORT}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  reports-service:
    build:
      context: ./services/reports-service
      dockerfile: Dockerfile
    container_name: fintrack-reports
    restart: unless-stopped
    ports:
      - "${REPORTS_SERVICE_PORT}:${REPORTS_SERVICE_PORT}"
    environment:
      PORT: ${REPORTS_SERVICE_PORT}
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${REPORTS_SERVICE_PORT}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===================
  # Frontend
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: fintrack-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      auth-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      reports-service:
        condition: service_healthy
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ===================
  # API Gateway (Nginx)
  # ===================
  nginx:
    image: nginx:alpine
    container_name: fintrack-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      reports-service:
        condition: service_healthy
    networks:
      - fintrack-network

networks:
  fintrack-network:
    driver: bridge

volumes:
  mysql_data:
  mariadb_data:
  redis_data:
