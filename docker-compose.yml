version: '3.8'

services:
  # ===================
  # Database Services
  # ===================
  mysql:
    image: mysql:8.0
    container_name: fintrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: auth_service_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:10.11
    container_name: fintrack-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: catat_pengeluaran
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: fintrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Backend Services
  # ===================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: fintrack-auth
    restart: unless-stopped
    command: sh -c "npx sequelize-cli db:migrate && node src/app.js"
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: auth_service_db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_URL: redis://fintrack-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    container_name: fintrack-transaction
    restart: unless-stopped
    command: sh -c "npx sequelize-cli db:migrate && node src/app.js"
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: catat_pengeluaran
      DB_USER: root
      DB_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  reports-service:
    build:
      context: ./services/reports-service
      dockerfile: Dockerfile
    container_name: fintrack-reports
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: catat_pengeluaran
      DB_USER: root
      DB_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4003/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===================
  # Frontend
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      auth-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      reports-service:
        condition: service_healthy
    networks:
      - fintrack-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ===================
  # API Gateway (Nginx)
  # ===================
  nginx:
    image: nginx:alpine
    container_name: fintrack-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      reports-service:
        condition: service_healthy
    networks:
      - fintrack-network

networks:
  fintrack-network:
    driver: bridge

volumes:
  mysql_data:
  mariadb_data:
  redis_data:
